<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrustPay 관리자</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">TP</div>
          <div>
            <strong>TrustPay</strong>
            <span>관리자 콘솔</span>
          </div>
        </div>
        <nav id="admin-tabs" class="side-nav" aria-label="관리자 메뉴"></nav>
        <form id="secret-form" class="login-panel">
          <div class="credential-grid">
            <label for="admin-id">관리자 아이디</label>
            <input id="admin-id" type="text" autocomplete="username" placeholder="admin" />
            <label for="admin-secret">관리자 비밀번호</label>
            <input id="admin-secret" type="password" autocomplete="current-password" placeholder="admin1234" />
          </div>
          <div class="secret-row">
            <button type="submit" class="primary">로그인</button>
          </div>
        </form>
      </aside>
      <section class="content-shell">
        <header class="topbar">
          <div>
            <div class="eyebrow">TrustPay Admin</div>
            <h1 id="content-title">대시보드</h1>
            <p id="content-desc">오늘 처리해야 할 운영 지표를 확인합니다.</p>
          </div>
          <div id="status-line" class="status-line">로그인 대기</div>
        </header>
        <section id="content-body" class="content-body">
          <div class="empty detail-empty">관리자 아이디와 비밀번호를 입력하세요.</div>
        </section>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
